apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: my-http-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: my-http-server
  template:
    metadata:
      name: my-http-server
      labels:
        app: my-http-server
    spec:
      containers:
        - name: my-http-server
          image: myhttpserver
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: VT_TRACES_ENDPOINT
              value: "http://vtsingle-my-victoria-metrics-k8s-stack.default.svc.cluster.local:10428/insert/opentelemetry/v1/traces"
      restartPolicy: Always
      